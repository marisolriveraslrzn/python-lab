<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Laboratorio Python</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>

<style>
body{
   font-family:Arial,sans-serif;
   padding:20px;
}

textarea{
   width:100%;
   height:250px;
}

pre{
   background:#f5f5f5;
   padding:10px;
}
</style>

</head>
<body>

<h2>🐍 Laboratorio Python</h2>

<textarea id="code">
print("Hola mundo")
</textarea>

<br><br>

<button onclick="runPython()">
Ejecutar
</button>

<h3>Salida</h3>

<pre id="output"></pre>

<script>

let pyodide;

async function loadPy() {
   pyodide = await loadPyodide();
}
loadPy();

async function runPython() {

   const code =
      document.getElementById("code").value;

   let output =
      document.getElementById("output");

   try {

      pyodide.setStdout({
         batched: (msg) => {
            output.textContent += msg + "\n";
         }
      });

      output.textContent = "";

      await pyodide.runPythonAsync(code);

   } catch(err) {
      output.textContent = err;
   }
}

</script>

</body>
</html>
